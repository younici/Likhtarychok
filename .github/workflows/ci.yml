name: CI/CD

on:
  push:
    branches: [master]   # GitHub default branch of younici/Likhtarychok
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # No frontend tests exist yet; ESLint is intentionally not run (known old errors).
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify frontend build
        run: test -f frontend/dist/index.html

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

      - name: Build backend Docker image
        run: docker build -t likhtarychok-backend:ci backend

  deploy:
    name: Deploy to production
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false   # never interrupt a running deploy
    env:
      STAGING: /tmp/likhtarychok-frontend-${{ github.run_id }}
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Check artifact
        run: test -f dist/index.html

      - name: Upload frontend to server (staging dir)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: dist/*
          target: ${{ env.STAGING }}
          strip_components: 1
          rm: true

      - name: Deploy backend, frontend and run health checks
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          FRONTEND_STAGING: ${{ env.STAGING }}
          DEPLOY_BRANCH: master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH,FRONTEND_STAGING,DEPLOY_BRANCH
          script_stop: true
          script: |
            set -e
            cd "$DEPLOY_PATH"
            [ "$(git rev-parse --abbrev-ref HEAD)" = "$DEPLOY_BRANCH" ] || { echo "server checkout is not on $DEPLOY_BRANCH"; exit 1; }
            git fetch origin "$DEPLOY_BRANCH"
            git merge --ff-only "origin/$DEPLOY_BRANCH"
            bash scripts/deploy.sh
