services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: likhtarychok-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
        required: false

  redis:
    image: redis:7-alpine
    container_name: likhtarychok-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
